<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCFF52;stop-opacity:0.2" />
    </linearGradient>

    <linearGradient id="iconBoardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#iconBg)"/>

  <!-- Main board -->
  <g transform="translate(256, 256)">
    <!-- Yellow border -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="none" stroke="#FCFF52" stroke-width="10"/>

    <!-- Board background -->
    <rect x="-135" y="-135" width="270" height="270" rx="20" fill="url(#iconBoardBg)" stroke="#374151" stroke-width="3"/>

    <!-- Grid lines -->
    <line x1="-135" y1="-45" x2="135" y2="-45" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="-135" y1="45" x2="135" y2="45" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="-45" y1="-135" x2="-45" y2="135" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="45" y1="-135" x2="45" y2="135" stroke="#d1d5db" stroke-width="2.5"/>

    <!-- X in top-left -->
    <g transform="translate(-90, -90)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in top-right -->
    <g transform="translate(90, -90)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in center -->
    <g transform="translate(0, 0)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in bottom-left -->
    <g transform="translate(-90, 90)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in bottom-right -->
    <g transform="translate(90, 90)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>
</svg>
