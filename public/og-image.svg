<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCFF52;stop-opacity:0.2" />
    </linearGradient>

    <linearGradient id="ogBoardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Left side - Board -->
  <g transform="translate(280, 315)">
    <!-- Yellow border -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="none" stroke="#FCFF52" stroke-width="10"/>

    <!-- Board background -->
    <rect x="-135" y="-135" width="270" height="270" rx="20" fill="url(#ogBoardBg)" stroke="#374151" stroke-width="3"/>

    <!-- Grid lines -->
    <line x1="-135" y1="-45" x2="135" y2="-45" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="-135" y1="45" x2="135" y2="45" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="-45" y1="-135" x2="-45" y2="135" stroke="#d1d5db" stroke-width="2.5"/>
    <line x1="45" y1="-135" x2="45" y2="135" stroke="#d1d5db" stroke-width="2.5"/>

    <!-- X in top-left -->
    <g transform="translate(-90, -90)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in top-right -->
    <g transform="translate(90, -90)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in center -->
    <g transform="translate(0, 0)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in bottom-left -->
    <g transform="translate(-90, 90)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in bottom-right -->
    <g transform="translate(90, 90)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right side - Text -->
  <g transform="translate(520, 0)">
    <!-- Main title -->
    <text x="320" y="260" font-size="90" fill="#1f2937" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-3">Tic-Tac-Toe</text>

    <!-- Subtitle -->
    <text x="320" y="340" font-size="48" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Play on Celo Blockchain</text>

    <!-- Yellow accent line -->
    <rect x="220" y="370" width="200" height="5" rx="2.5" fill="#FCFF52"/>

    <!-- Features -->
    <text x="70" y="440" font-size="28" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ On-chain gameplay</text>
    <text x="70" y="485" font-size="28" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Powered by Farcaster</text>
    <text x="70" y="530" font-size="28" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Free to play</text>
  </g>
</svg>
