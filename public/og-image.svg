<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCFF52;stop-opacity:0.2" />
    </linearGradient>

    <linearGradient id="ogBoardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#ogBg)"/>

  <!-- Left side - Board (optimized size) -->
  <g transform="translate(260, 400)">
    <!-- Yellow border -->
    <rect x="-150" y="-150" width="300" height="300" rx="24" fill="none" stroke="#FCFF52" stroke-width="10"/>

    <!-- Board background -->
    <rect x="-145" y="-145" width="290" height="290" rx="20" fill="url(#ogBoardBg)" stroke="#374151" stroke-width="4"/>

    <!-- Grid lines -->
    <line x1="-145" y1="-48" x2="145" y2="-48" stroke="#d1d5db" stroke-width="3"/>
    <line x1="-145" y1="48" x2="145" y2="48" stroke="#d1d5db" stroke-width="3"/>
    <line x1="-48" y1="-145" x2="-48" y2="145" stroke="#d1d5db" stroke-width="3"/>
    <line x1="48" y1="-145" x2="48" y2="145" stroke="#d1d5db" stroke-width="3"/>

    <!-- X in top-left -->
    <g transform="translate(-96, -96)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in top-right -->
    <g transform="translate(96, -96)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in center -->
    <g transform="translate(0, 0)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O in bottom-left -->
    <g transform="translate(-96, 96)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1f2937" stroke-width="9"/>
    </g>

    <!-- X in bottom-right -->
    <g transform="translate(96, 96)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right side - Text (optimized for better impact) -->
  <g transform="translate(540, 0)">
    <!-- Main title -->
    <text x="330" y="280" font-size="115" fill="#1f2937" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-3">Tic-Tac-Toe</text>

    <!-- Subtitle -->
    <text x="330" y="370" font-size="46" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Play on Celo Blockchain</text>

    <!-- Yellow accent line -->
    <rect x="205" y="400" width="250" height="5" rx="2.5" fill="#FCFF52"/>

    <!-- Features (optimized spacing) -->
    <text x="80" y="480" font-size="30" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ On-chain gameplay</text>
    <text x="80" y="530" font-size="30" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Powered by Farcaster</text>
    <text x="80" y="580" font-size="30" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Free to play</text>
  </g>
</svg>
