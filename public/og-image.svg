<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCFF52;stop-opacity:0.2" />
    </linearGradient>

    <linearGradient id="ogBoardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#ogBg)"/>

  <!-- Left side - Board (smaller and better positioned) -->
  <g transform="translate(240, 400)">
    <!-- Yellow border -->
    <rect x="-120" y="-120" width="240" height="240" rx="20" fill="none" stroke="#FCFF52" stroke-width="8"/>

    <!-- Board background -->
    <rect x="-115" y="-115" width="230" height="230" rx="16" fill="url(#ogBoardBg)" stroke="#374151" stroke-width="3"/>

    <!-- Grid lines -->
    <line x1="-115" y1="-38" x2="115" y2="-38" stroke="#d1d5db" stroke-width="2"/>
    <line x1="-115" y1="38" x2="115" y2="38" stroke="#d1d5db" stroke-width="2"/>
    <line x1="-38" y1="-115" x2="-38" y2="115" stroke="#d1d5db" stroke-width="2"/>
    <line x1="38" y1="-115" x2="38" y2="115" stroke="#d1d5db" stroke-width="2"/>

    <!-- X in top-left -->
    <g transform="translate(-76, -76)">
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- O in top-right -->
    <g transform="translate(76, -76)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#1f2937" stroke-width="7"/>
    </g>

    <!-- X in center -->
    <g transform="translate(0, 0)">
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- O in bottom-left -->
    <g transform="translate(-76, 76)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#1f2937" stroke-width="7"/>
    </g>

    <!-- X in bottom-right -->
    <g transform="translate(76, 76)">
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right side - Text (better centered vertically) -->
  <g transform="translate(450, 0)">
    <!-- Main title -->
    <text x="350" y="285" font-size="95" fill="#1f2937" font-family="system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-3">Tic-Tac-Toe</text>

    <!-- Subtitle -->
    <text x="350" y="365" font-size="38" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Play on Celo Blockchain</text>

    <!-- Yellow accent line -->
    <rect x="250" y="390" width="200" height="4" rx="2" fill="#FCFF52"/>

    <!-- Features (more compact and centered) -->
    <text x="150" y="460" font-size="26" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ On-chain gameplay</text>
    <text x="150" y="505" font-size="26" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Powered by Farcaster</text>
    <text x="150" y="550" font-size="26" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-weight="600">✓ Free to play</text>
  </g>
</svg>
